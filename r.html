<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oakberry</title>
<style>
  body { font-family: sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; background:#0e0b16; color:#fff; }
  .msg { text-align:center; }
  .spin { width:36px; height:36px; border:3px solid rgba(255,255,255,0.2); border-top-color:#F5C842; border-radius:50%; animation:spin 0.7s linear infinite; margin:0 auto 16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  p { font-size:13px; opacity:0.5; margin-top:8px; }
</style>
</head>
<body>
<div class="msg">
  <div class="spin"></div>
  <div>Cargando tu cupón...</div>
  <p id="errMsg"></p>
</div>
<script>
const SCRIPT_URL = "https://api.oakberry-cupones.com";

const alias = window.location.hash.replace("#","").trim();

if (!alias) {
  document.getElementById("errMsg").textContent = "Link inválido";
} else {
  resolverConReintento(alias);
}

function resolverAlias(alias) {
  return new Promise((resolve, reject) => {
    const cb = "cb_r_" + Math.random().toString(36).slice(2);
    const url = SCRIPT_URL + "?accion=resolverAlias&alias=" + encodeURIComponent(alias) + "&callback=" + cb;
    const s = document.createElement("script");
    let settled = false;

    function cleanup() {
      settled = true;
      delete window[cb];
      if (s.parentNode) s.parentNode.removeChild(s);
    }

    window[cb] = function(data) {
      if (settled) return;
      cleanup();
      resolve(data);
    };

    // FIX MÓVIL: onerror rechaza en lugar de ignorar
    s.onerror = function() {
      if (settled) return;
      cleanup();
      reject(new Error("script-error"));
    };

    s.src = url;
    document.body.appendChild(s);

    setTimeout(function() {
      if (!settled) {
        cleanup();
        reject(new Error("timeout"));
      }
    }, 12000);
  });
}

async function resolverConReintento(alias) {
  try {
    const data = await resolverAlias(alias);
    if (data && data.link) {
      window.location.replace(data.link);
    } else {
      document.getElementById("errMsg").textContent = "Link no encontrado: " + alias;
    }
  } catch(e) {
    // Reintento automático — en móvil Safari el primer intento falla
    // por el redirect 302 pero el segundo funciona
    try {
      await new Promise(r => setTimeout(r, 400));
      const data = await resolverAlias(alias);
      if (data && data.link) {
        window.location.replace(data.link);
      } else {
        document.getElementById("errMsg").textContent = "Link no encontrado: " + alias;
      }
    } catch(e2) {
      document.getElementById("errMsg").textContent = "Error de conexión. Intenta de nuevo.";
    }
  }
}
</script>
</body>
</html>
