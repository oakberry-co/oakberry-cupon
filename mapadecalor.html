<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de calor — Adquisición Oakberry</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
  :root{--beige:#f6f1e4;--morado:#3d2b5e;--morado-c:#9b85c4;--oro:#b8860b;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Montserrat',system-ui,sans-serif;background:var(--beige)}
  #map{position:absolute;inset:0;z-index:1}
  .panel{position:absolute;top:14px;left:14px;z-index:1000;background:rgba(246,241,228,.96);
    border:2px solid var(--morado);border-radius:14px;padding:14px 16px;max-width:290px;
    box-shadow:0 6px 22px rgba(61,43,94,.28)}
  .panel h1{font-size:15px;color:var(--morado);font-weight:800;letter-spacing:.3px;margin-bottom:2px}
  .panel .sub{font-size:11px;color:#6b5b86;margin-bottom:10px}
  .kpis{display:flex;gap:8px;margin-bottom:12px}
  .kpi{flex:1;background:#fff;border-radius:10px;padding:8px 6px;text-align:center;border:1px solid #e3dcc9}
  .kpi b{display:block;font-size:19px;color:var(--morado);line-height:1}
  .kpi span{font-size:9.5px;color:#7a6b93;text-transform:uppercase;letter-spacing:.4px}
  .toggle{display:flex;gap:6px;margin-bottom:10px}
  .toggle button{flex:1;font-size:11px;font-weight:700;padding:7px 4px;border-radius:8px;
    border:1.5px solid var(--morado);background:#fff;color:var(--morado);cursor:pointer;transition:.15s}
  .toggle button.on{background:var(--morado);color:#fff}
  .leg{font-size:10.5px;color:#5a4a75;line-height:1.5}
  .leg .bar{height:10px;border-radius:5px;margin:4px 0;
    background:linear-gradient(90deg,#4a90d9,#7ec850,#f5d442,#f0932b,#e74c3c)}
  .leg .row{display:flex;justify-content:space-between}
  .store-dot{color:var(--oro)}
  .foot{font-size:9px;color:#8a7ba3;margin-top:10px;border-top:1px solid #ddd4bf;padding-top:7px}
  .leaflet-popup-content{font-family:inherit;font-size:12px}
  #status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:1200;font-size:14px;color:var(--morado);background:var(--beige)}
</style>
</head>
<body>
<div id="map"></div>
<div id="status">Cargando mapa…</div>
<div class="panel" style="display:none" id="panel">
  <h1>&#129747; D&oacute;nde crean cupones</h1>
  <div class="sub">Programa de Adquisici&oacute;n &middot; geolocalizaci&oacute;n por IP</div>
  <div class="kpis">
    <div class="kpi"><b id="k1">0</b><span>Cupones geo</span></div>
    <div class="kpi"><b id="k2">0</b><span>Canjeados</span></div>
    <div class="kpi"><b id="k3">0</b><span>Zonas</span></div>
  </div>
  <div class="toggle">
    <button id="bAll" class="on" onclick="setMode(0)">Todos los creados</button>
    <button id="bRed" onclick="setMode(1)">Solo canjeados</button>
  </div>
  <div class="leg">
    <div class="row"><span>menos</span><span>concentraci&oacute;n</span><span>m&aacute;s</span></div>
    <div class="bar"></div>
    <div style="margin-top:6px"><span class="store-dot">&#9670;</span> Tiendas Oakberry</div>
  </div>
  <div class="foot">Datos en vivo &middot; IP = precisi&oacute;n ciudad/barrio, no domicilio exacto.</div>
</div>
<script>
const API = 'https://api.oakberry-cupones.com/?accion=mapaCalorDatos';
let map, heat, storeLayer, DATA;

function initMap(){
  map = L.map('map',{zoomControl:true}).setView([4.6,-74.08],6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19, subdomains:'abcd'}).addTo(map);
}

function buildHeat(mode){
  const wi = mode===0?2:3;
  const rows = DATA.heat.filter(r=>r[wi]>0);
  const max = Math.max.apply(null, rows.map(r=>r[wi]));
  const pts = rows.map(r=>[r[0],r[1], r[wi]/max]);
  return L.heatLayer(pts,{radius:32,blur:22,maxZoom:11,minOpacity:.35,
    gradient:{0.0:'#4a90d9',0.35:'#7ec850',0.6:'#f5d442',0.8:'#f0932b',1.0:'#e74c3c'}});
}

function setMode(m){
  map.removeLayer(heat);
  heat = buildHeat(m).addTo(map);
  storeLayer.bringToFront();
  document.getElementById('bAll').classList.toggle('on',m===0);
  document.getElementById('bRed').classList.toggle('on',m===1);
}

function render(){
  document.getElementById('k1').textContent = DATA.total.toLocaleString('es');
  document.getElementById('k2').textContent = DATA.canjeados.toLocaleString('es');
  document.getElementById('k3').textContent = DATA.nodos;
  storeLayer = L.layerGroup().addTo(map);
  DATA.stores.forEach(s=>{
    L.circleMarker([s.lat,s.lng],{radius:5,color:'#7a5c00',weight:1.5,
      fillColor:'#b8860b',fillOpacity:.95})
     .bindPopup('<b>'+s.nombre+'</b><br>'+(s.ciudad||'')+' &middot; Tienda Oakberry')
     .addTo(storeLayer);
  });
  heat = buildHeat(0).addTo(map);
  document.getElementById('status').style.display='none';
  document.getElementById('panel').style.display='block';
}

initMap();
fetch(API).then(r=>r.json()).then(d=>{
  if(!d || !d.ok || !d.heat){ throw new Error('sin datos'); }
  DATA = d; render();
}).catch(e=>{
  document.getElementById('status').textContent = 'No se pudo cargar el mapa. Reintenta en un momento.';
});
</script>
</body>
</html>
