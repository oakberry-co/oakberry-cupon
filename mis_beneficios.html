<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis beneficios · Amigos de Oakberry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --morado:#5F4B8B; --morado-osc:#3d2b5e; --amarillo:#F5C842; --beige:#f6f1e4; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Montserrat',sans-serif; color:var(--morado-osc); min-height:100vh; padding:20px;
        background:linear-gradient(rgba(61,43,94,.55),rgba(61,43,94,.82)),
                   url('/amigos-bg.jpg') center/cover fixed, var(--morado-osc); }
  .card{ max-width:430px; margin:0 auto; background:#fff; border-radius:22px; overflow:hidden;
         box-shadow:0 18px 50px rgba(61,43,94,.35); }
  .hero{ background:linear-gradient(135deg,var(--morado),var(--morado-osc)); color:#fff; padding:24px 22px; text-align:center; }
  .hero img{ height:28px; margin-bottom:10px; }
  .hero h1{ font-size:1.2rem; font-weight:800; }
  .body{ padding:22px; }
  .code{ font-size:2rem; font-weight:800; letter-spacing:3px; color:var(--morado);
         background:var(--beige); border:2px dashed var(--morado); border-radius:14px; padding:14px; text-align:center; }
  .store{ font-weight:800; font-size:.95rem; margin:16px 0 6px; text-align:center; color:var(--morado-osc); }
  h2{ font-size:.95rem; color:var(--morado); margin:18px 0 8px; }
  .b{ display:flex; gap:10px; padding:8px 0; border-bottom:1px solid #efe9f7; font-size:.86rem; }
  .b .d{ font-weight:700; min-width:88px; }
  .b .h{ color:#8a7fa3; font-size:.72rem; }
  .esc{ display:flex; gap:10px; padding:8px 0; font-size:.9rem; align-items:center; }
  .esc .p{ background:var(--morado); color:#fff; font-weight:700; font-size:.74rem; padding:3px 9px; border-radius:10px; }
  .how{ background:#fff8e6; border:1.5px solid var(--amarillo); border-radius:12px; padding:13px 15px;
        margin-top:16px; font-size:.82rem; line-height:1.5; }
  .perm{ background:var(--beige); border-radius:12px; padding:11px 13px; margin-top:12px;
         font-size:.78rem; line-height:1.45; color:var(--morado-osc); }
  .vig{ text-align:center; font-size:.82rem; color:var(--morado); font-weight:700; margin:10px 0 2px; }
  .rec{ padding:6px 2px; }
  .rec-msg{ background:#fff8e6; border:1.5px solid var(--amarillo); border-radius:12px;
            padding:11px 13px; margin-bottom:16px; font-size:.82rem; line-height:1.4; }
  .rec input{ width:100%; padding:13px 14px; font-size:1rem; font-family:inherit;
              border:2px solid #e3dcf0; border-radius:12px; margin-bottom:10px; outline:none; }
  .rec input:focus{ border-color:var(--morado); }
  .rec button{ width:100%; padding:13px; font-size:.95rem; font-weight:800; font-family:inherit;
               color:var(--morado-osc); background:var(--amarillo); border:0; border-radius:12px; cursor:pointer; }
  .rec button:disabled{ opacity:.6; cursor:default; }
  .rec-err{ color:#c0392b; font-size:.8rem; margin-top:8px; min-height:1em; }
  .loading{ text-align:center; padding:40px; color:#8a7fa3; }
  .foot{ text-align:center; font-size:.66rem; color:#a89ec0; padding:12px; }
</style>
</head>
<body>
<div class="card">
  <div class="hero">
    <img src="/email-logo-cream.png" alt="Oakberry">
    <h1>Mis beneficios · Amigos</h1>
  </div>
  <div class="body" id="body"><div class="loading">Cargando tus beneficios…</div></div>
  <div class="foot">Oakberry Colombia · Programa Amigos</div>
</div>
<script>
const API="https://api.oakberry-cupones.com/";
const Q=new URLSearchParams(location.search);
const EMPRESA=(Q.get("empresa")||"").trim();
const CODIGO=(Q.get("c")||Q.get("codigo")||"").trim();
const DIAS={1:"Lunes",2:"Martes",3:"Miércoles",4:"Jueves",5:"Viernes",6:"Sábado",7:"Domingo"};
function pp(s){ return (s||"").replace(/BOWL THE ONE 9 OZ/gi,"Bowl 9oz").replace(/BOWL CLASSIC 12 OZ/gi,"Bowl 12oz").replace(/BALDE 800 ML/gi,"Pote de açaí"); }
function jsonp(params){ return new Promise(res=>{ const cb="cb"+Math.random().toString(36).slice(2);
  const s=document.createElement("script"); const t=setTimeout(()=>{cl();res({});},12000);
  function cl(){try{delete window[cb];}catch(e){} if(s.parentNode)s.remove(); clearTimeout(t);}
  window[cb]=r=>{cl();res(r||{});}; params.set("callback",cb); s.src=API+"?"+params.toString();
  s.onerror=()=>{cl();res({});}; document.body.appendChild(s); }); }

function fmtFecha(iso){ if(!iso) return ""; const p=String(iso).slice(0,10).split("-");
  return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : iso; }

function render(r){
  const body=document.getElementById("body");
  let h="";
  if(r.codigo){
    h+=`<p style="font-size:.8rem;color:#8a7fa3">Tu código:</p><div class="code">${r.codigo}</div>`;
    h+=`<div class="perm">🔒 <b>Este es tu código fijo</b> — guárdalo, es el mismo siempre. Lo usas en <b>cada visita</b> mientras el programa esté activo (no se gasta con cada compra).</div>`;
  }
  h+=`<div class="store">📍 Válido SOLO en Oakberry ${r.tienda||""}</div>`;
  if(r.fechaFin){ h+=`<div class="vig">⏳ Programa activo hasta el <b>${fmtFecha(r.fechaFin)}</b></div>`; }
  if(r.modo==="escalado" && (r.escalera||[]).length){
    h+="<h2>🔼 Escalera por compra</h2>";
    r.escalera.forEach(e=>{ h+=`<div class="esc"><span class="p">Compra #${e.paso}</span><span><b>${e.valor_pct}% OFF</b></span></div>`; });
    h+=`<p style="font-size:.74rem;color:#8a7fa3;margin-top:4px">${r.escaleraLuego?"Al terminar la escalera sigues con los beneficios por día 👇":"Beneficios de la escalera por tiempo limitado."}</p>`;
  }
  if((r.calendario||[]).length){
    h+="<h2>🎁 Beneficios por día</h2>";
    r.calendario.forEach(b=>{ const dia=DIAS[b.dia_semana]||""; const desc=b.tipo==="topping"?"Topping gratis":(b.valor_pct+"% OFF");
      const prod=b.productos_aplica?" · "+pp(b.productos_aplica):""; const hora=b.ventanas?b.ventanas.replace(/,/g," y ").replace(/-/g,"–"):"";
      h+=`<div class="b"><span class="d">${dia}</span><span>${desc}${prod}${hora?`<br><span class="h">${hora}</span>`:""}</span></div>`; });
  }
  h+=`<div class="how"><b>¿Cómo reclamar?</b><br>Muestra tu código (o da tu celular) en la caja de Oakberry ${r.tienda||""}. Debes estar registrado en <b>Loopy</b> con tu mismo correo o celular para que aplique.</div>`;
  body.innerHTML=h;
}

function recoveryForm(msg){
  const body=document.getElementById("body");
  body.innerHTML=`
    <div class="rec">
      ${msg?`<p class="rec-msg">${msg}</p>`:""}
      <h2 style="margin-top:0">¿Perdiste tu código?</h2>
      <p style="font-size:.85rem;color:#8a7fa3;margin-bottom:12px">Ingresa el WhatsApp con el que te registraste y te mostramos tus beneficios.</p>
      <input id="recCel" type="tel" inputmode="numeric" placeholder="Tu WhatsApp (10 dígitos)" />
      <button id="recBtn">Ver mis beneficios</button>
      <p id="recErr" class="rec-err"></p>
    </div>`;
  const inp=document.getElementById("recCel"), btn=document.getElementById("recBtn"), err=document.getElementById("recErr");
  async function go(){
    const cel=(inp.value||"").replace(/\D/g,"").slice(-10);
    if(cel.length!==10){ err.textContent="Ingresa un WhatsApp válido de 10 dígitos."; return; }
    err.textContent=""; btn.disabled=true; btn.textContent="Buscando…";
    const params=new URLSearchParams({accion:"misBeneficios", celular:cel});
    if(EMPRESA) params.set("empresa",EMPRESA);
    const r=await jsonp(params);
    btn.disabled=false; btn.textContent="Ver mis beneficios";
    if(r.ok && r.codigo){ render(r); }
    else{ err.textContent="No encontramos un registro con ese WhatsApp. ¿Aún no te registras?"; }
  }
  btn.addEventListener("click",go);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
}

(async function(){
  const body=document.getElementById("body");
  if(!CODIGO){ recoveryForm(""); return; }
  const r=await jsonp(new URLSearchParams({accion:"misBeneficios", empresa:EMPRESA, codigo:CODIGO}));
  if(r.ok && r.codigo){ render(r); }
  else{ recoveryForm("No pudimos cargar tu link. Recupera tu código con tu WhatsApp:"); }
})();
</script>
</body>
</html>
