<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oakberry · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0C0A0E; --bg2:#141118; --bg3:#1C1825;
  --border:rgba(255,255,255,0.07); --text:#F0EBF8; --muted:#7A6E8A;
  --p:#7C4DFF; --p2:#9D71FF; --coral:#FF5B35; --yellow:#F5C842;
  --green:#00C896; --teal:#00B8D4;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

.header{position:sticky;top:0;z-index:100;background:rgba(12,10,14,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:12px;}
.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:0 0 12px var(--coral);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.logo-name{font-size:16px;font-weight:800;letter-spacing:3px;text-transform:uppercase;}
.logo-sub{font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);letter-spacing:2px;margin-top:2px;}
.header-right{display:flex;align-items:center;gap:12px;}
.last-update{font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;font-family:'Syne',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:1px;}
.btn:hover{border-color:var(--p);color:var(--p2);}
.btn.coral{background:rgba(255,91,53,0.1);border-color:rgba(255,91,53,0.3);color:var(--coral);}
.btn.coral:hover{background:rgba(255,91,53,0.2);}

.tabs{display:flex;gap:4px;padding:24px 32px 0;position:relative;z-index:1;}
.tab{padding:10px 20px;border-radius:8px 8px 0 0;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border:1px solid transparent;border-bottom:none;transition:all .2s;color:var(--muted);}
.tab.active{background:var(--bg2);border-color:var(--border);color:var(--text);}
.tab:hover:not(.active){color:var(--text);}

.main{padding:0 32px 48px;position:relative;z-index:1;}
.panel{display:none;background:var(--bg2);border:1px solid var(--border);border-radius:0 12px 12px 12px;padding:32px;}
.panel.active{display:block;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:32px;}
.kpi{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;overflow:hidden;}
.kpi::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.08;}
.kpi.p::after{background:var(--p);}
.kpi.coral::after{background:var(--coral);}
.kpi.yellow::after{background:var(--yellow);}
.kpi.green::after{background:var(--green);}
.kpi.teal::after{background:var(--teal);}
.kpi-label{font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;}
.kpi-value{font-size:26px;font-weight:800;line-height:1;}
.kpi.p .kpi-value{color:var(--p2);}
.kpi.coral .kpi-value{color:var(--coral);}
.kpi.yellow .kpi-value{color:var(--yellow);}
.kpi.green .kpi-value{color:var(--green);}
.kpi.teal .kpi-value{color:var(--teal);}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:6px;font-family:'DM Mono',monospace;}

.section-title{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:24px 0 16px;display:flex;align-items:center;gap:10px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

.table-wrap{overflow-x:auto;margin-bottom:24px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{padding:10px 14px;text-align:left;font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid var(--border);}
tbody tr{border-bottom:1px solid rgba(255,255,255,0.03);transition:background .15s;}
tbody tr:hover{background:rgba(255,255,255,0.02);}
tbody td{padding:11px 14px;font-family:'DM Mono',monospace;font-size:12px;}

.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.bar-label{font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);width:100px;flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;height:8px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width 1.2s cubic-bezier(0.22,1,0.36,1);}
.bar-val{font-size:11px;font-family:'DM Mono',monospace;color:var(--text);width:50px;text-align:right;}

.ab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px;}
.ab-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;}
.ab-label{font-size:10px;font-family:'DM Mono',monospace;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;color:var(--muted);}
.ab-pct{font-size:34px;font-weight:800;line-height:1;margin-bottom:4px;}
.ab-sub{font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);}

.city-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px;}
.city-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:16px;}
.city-name{font-size:13px;font-weight:700;margin-bottom:10px;}
.city-row{display:flex;justify-content:space-between;font-size:11px;font-family:'DM Mono',monospace;margin-bottom:5px;}
.city-row span:first-child{color:var(--muted);}

.loading{display:flex;align-items:center;justify-content:center;padding:60px;flex-direction:column;gap:16px;}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-txt{font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);letter-spacing:2px;}
.error{background:rgba(255,91,53,0.08);border:1px solid rgba(255,91,53,0.2);border-radius:12px;padding:16px;font-family:'DM Mono',monospace;font-size:12px;color:var(--coral);margin-bottom:16px;}
.info{background:rgba(124,77,255,0.08);border:1px solid rgba(124,77,255,0.2);border-radius:12px;padding:16px;font-family:'DM Mono',monospace;font-size:12px;color:var(--p2);margin-bottom:16px;}

@media(max-width:768px){
  .header,.main{padding-left:16px;padding-right:16px;}
  .tabs{padding:16px 16px 0;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-dot"></div>
    <div>
      <div class="logo-name">Oakberry</div>
      <div class="logo-sub">Dashboard · Cupones Colombia</div>
    </div>
  </div>
  <div class="header-right">
    <div class="last-update" id="lastUpdate">—</div>
    <button class="btn coral" onclick="actualizarDashboard()" id="btnActualizar">⟳ Recalcular</button>
    <button class="btn" onclick="cargarTodo()">↻ Recargar</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('resumen',this)">Resumen</div>
  <div class="tab" onclick="switchTab('campanas',this)">Fuentes</div>
  <div class="tab" onclick="switchTab('ciudades',this)">Ciudades</div>
  <div class="tab" onclick="switchTab('reactivacion',this)">Reactivación</div>
  <div class="tab" onclick="switchTab('meta',this)">Meta Ads</div>
  <div class="tab" onclick="switchTab('cac',this)">CAC & ROI</div>
</div>

<div class="main">
  <div class="panel active" id="panel-resumen"><div class="loading"><div class="spinner"></div><div class="loading-txt">Cargando datos...</div></div></div>
  <div class="panel" id="panel-campanas"><div class="loading"><div class="spinner"></div><div class="loading-txt">Cargando fuentes...</div></div></div>
  <div class="panel" id="panel-ciudades"><div class="loading"><div class="spinner"></div><div class="loading-txt">Cargando ciudades...</div></div></div>
  <div class="panel" id="panel-reactivacion"><div class="loading"><div class="spinner"></div><div class="loading-txt">Cargando reactivación...</div></div></div>
  <div class="panel" id="panel-meta"><div class="loading"><div class="spinner"></div><div class="loading-txt">Cargando Meta Ads...</div></div></div>
  <div class="panel" id="panel-cac"><div class="loading"><div class="spinner"></div><div class="loading-txt">Calculando CAC...</div></div></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJKDl-AIEEh8gHA4NQTLIfkZAQsffGwhS1Pgv-F-E54voGpl4fnxPBrGRPoXmUKsOI/exec";
const PRECIO_BOWL = 25400;

// ── JSONP ─────────────────────────────────────────────────────
function fetchSheets(params) {
  return new Promise((res,rej)=>{
    const cb="cb_"+Math.random().toString(36).slice(2);
    const url=SCRIPT_URL+"?"+new URLSearchParams({...params,callback:cb});
    const s=document.createElement('script');
    let done=false;
    const timer=setTimeout(()=>{if(!done){done=true;delete window[cb];if(s.parentNode)s.remove();rej(new Error('timeout'));}},20000);
    window[cb]=d=>{if(done)return;done=true;clearTimeout(timer);delete window[cb];if(s.parentNode)s.remove();res(d);};
    s.onerror=()=>{if(done)return;done=true;clearTimeout(timer);rej(new Error('error'));};
    s.src=url;document.body.appendChild(s);
  });
}

// ── HELPERS ───────────────────────────────────────────────────
const fmt = n=>Number(n||0).toLocaleString('es-CO');
const cop = n=>'$'+Number(n||0).toLocaleString('es-CO');
const pct = (a,b)=>b>0?((a/b)*100).toFixed(1)+'%':'0%';

function bars(items, maxVal) {
  const max = maxVal || Math.max(...items.map(i=>Number(i.val)||0), 1);
  return items.map(({label,val,color})=>`
    <div class="bar-row">
      <div class="bar-label" title="${label}">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round((Number(val)||0)/max*100)}%;background:${color||'var(--p)'};"></div></div>
      <div class="bar-val">${fmt(val)}</div>
    </div>`).join('');
}

// ── TABS ─────────────────────────────────────────────────────
let _loaded={};
function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
  if(!_loaded[name]){_loaded[name]=true;renderTab(name);}
}

// ── DATOS ─────────────────────────────────────────────────────
let _dashData = null;

async function cargarDatos() {
  const d = await fetchSheets({accion:'leerHojaDashboard'});
  if (!d.ok) throw new Error(d.mensaje||'Error al leer Dashboard');
  return parsearHoja(d.rows);
}

function parsearHoja(rows) {
  // La hoja tiene secciones separadas por headers morados
  const d = {
    actualizacion:'',
    kpis:{}, fuentes:[], ciudades:[],
    abTest:[], reactivacion:[]
  };

  let seccion = '';
  for (let i=0; i<rows.length; i++) {
    const r = rows[i];
    const r0 = (r[0]||'').toString().trim();

    if (r0.includes('Última actualización:')) {
      d.actualizacion = r0.replace('OAKBERRY · Dashboard Cupones','').trim();
      continue;
    }
    if (r0==='KPIs GLOBALES')        { seccion='kpis'; continue; }
    if (r0==='CUPONES POR FUENTE')   { seccion='fuentes'; continue; }
    if (r0==='CUPONES POR CIUDAD')   { seccion='ciudades'; continue; }
    if (r0==='A/B TEST REACTIVACIÓN'){ seccion='ab'; continue; }
    if (r0==='REACTIVACIÓN vs PRIMER IMPACTO'){ seccion='rea'; continue; }

    // Headers (fila morada — primera celda es label)
    if (r0==='Métrica'||r0==='Fuente'||r0==='Ciudad'||r0==='Grupo'||r0==='Flujo') continue;

    if (!r0) continue;

    if (seccion==='kpis') {
      d.kpis[r0] = { total:r[1], n1:r[2], e1:r[3], e2:r[4], e3:r[5], nota:r[6] };
    }
    if (seccion==='fuentes') {
      d.fuentes.push({ fuente:r[0], entregados:r[1], canjeados:r[2], tasa:r[3], vencidos:r[4] });
    }
    if (seccion==='ciudades') {
      d.ciudades.push({ ciudad:r[0], entregados:r[1], canjeados:r[2], tasa:r[3], vencidos:r[4] });
    }
    if (seccion==='ab') {
      d.abTest.push({ grupo:r[0], enviados:r[1], canjeados:r[2], tasa:r[3] });
    }
    if (seccion==='rea') {
      d.reactivacion.push({ flujo:r[0], tasa:r[1], obs:r[2] });
    }
  }
  return d;
}

async function cargarTodo() {
  _loaded={};_dashData=null;
  document.querySelectorAll('.panel').forEach(p=>p.innerHTML='<div class="loading"><div class="spinner"></div><div class="loading-txt">Cargando...</div></div>');
  document.getElementById('panel-resumen').classList.add('active');
  _loaded['resumen']=true;
  await renderTab('resumen');
}

async function actualizarDashboard() {
  const btn = document.getElementById('btnActualizar');
  btn.textContent='⟳ Calculando...';btn.disabled=true;
  try {
    const r = await fetchSheets({accion:'dashboardHoja'});
    if (r.ok) {
      btn.textContent='✅ Listo';
      await cargarTodo();
    } else {
      btn.textContent='❌ Error';
      alert(r.mensaje||'Error al actualizar');
    }
  } catch(e) {
    btn.textContent='❌ Error';
    alert(e.message);
  }
  setTimeout(()=>{btn.textContent='⟳ Recalcular';btn.disabled=false;},2000);
}

async function renderTab(name) {
  try {
    if (name === 'meta') { await renderMeta(); return; }
    if (name === 'cac')  { await renderCAC();  return; }
    if (!_dashData) _dashData = await cargarDatos();
    const d = _dashData;
    document.getElementById('lastUpdate').textContent = d.actualizacion||'';;
    if (name==='resumen')      renderResumen(d);
    if (name==='campanas')     renderCampanas(d);
    if (name==='ciudades')     renderCiudades(d);
    if (name==='reactivacion') renderReactivacion(d);
  } catch(e) {
    document.getElementById('panel-'+name).innerHTML =
      `<div class="error">Error: ${e.message}<br><br>` +
      `<strong>Solución:</strong> Haz clic en "⟳ Recalcular" para generar la hoja Dashboard por primera vez.</div>`;
  }
}

// ── META ADS ─────────────────────────────────────────────────
async function renderMeta() {
  const el = document.getElementById('panel-meta');
  el.innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-txt">Consultando Meta Ads...</div></div>';
  try {
    const data = await fetchSheets({ accion:'leerMeta' });
    if (!data.ok) {
      el.innerHTML = `
        <div class="info">No hay datos de Meta Ads aún.</div>
        <button class="btn" onclick="sincronizarMeta()" id="btnSyncMeta">↻ Sincronizar Meta Ads ahora</button>`;
      return;
    }
    const rows    = data.rows || [];
    const totales = data.totales || [];
    const act     = data.actualizado ? new Date(data.actualizado).toLocaleString('es-CO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';

    // KPIs desde totales
    const gastoTotal  = Number(totales[8]||0);
    const impTotal    = Number(totales[2]||0);
    const clicsTotal  = Number(totales[4]||0);
    const resTotal    = Number(totales[9]||0);
    const ctrTotal    = impTotal>0 ? (clicsTotal/impTotal*100).toFixed(2)+'%' : '0%';
    const cpaTotal    = resTotal>0 ? '$'+Math.round(gastoTotal/resTotal).toLocaleString('es-CO') : '—';

    el.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
        <div class="section-title" style="margin:0">Últimos 30 días · ${rows.length} ad sets</div>
        <div style="display:flex;gap:10px;align-items:center;">
          <span style="font-size:10px;font-family:'DM Mono',monospace;color:var(--muted)">Actualizado: ${act}</span>
          <button class="btn" onclick="sincronizarMeta()" id="btnSyncMeta">↻ Sincronizar</button>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi coral"><div class="kpi-label">Gasto total</div><div class="kpi-value">${cop(gastoTotal)}</div><div class="kpi-sub">últimos 30 días</div></div>
        <div class="kpi p"><div class="kpi-label">Impresiones</div><div class="kpi-value">${fmt(impTotal)}</div><div class="kpi-sub">alcance total</div></div>
        <div class="kpi teal"><div class="kpi-label">Clics</div><div class="kpi-value">${fmt(clicsTotal)}</div><div class="kpi-sub">CTR: ${ctrTotal}</div></div>
        <div class="kpi yellow"><div class="kpi-label">Resultados</div><div class="kpi-value">${fmt(resTotal)}</div><div class="kpi-sub">leads/conversiones</div></div>
        <div class="kpi green"><div class="kpi-label">Costo/resultado</div><div class="kpi-value">${cpaTotal}</div><div class="kpi-sub">CPA promedio</div></div>
      </div>

      <div class="section-title">Por conjunto de anuncios</div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Campaña</th><th>Ad Set</th><th>Impresiones</th><th>Alcance</th>
            <th>Clics</th><th>CTR</th><th>CPC</th><th>CPM</th><th>Gasto</th><th>Resultados</th><th>Costo/Res.</th>
          </tr></thead>
          <tbody>
            ${rows.map(r=>`<tr>
              <td style="color:var(--muted);font-size:11px">${r[0]||'—'}</td>
              <td style="font-weight:700">${r[1]||'—'}</td>
              <td>${fmt(r[2])}</td>
              <td style="color:var(--muted)">${fmt(r[3])}</td>
              <td>${fmt(r[4])}</td>
              <td style="color:var(--yellow)">${r[5]||'—'}</td>
              <td style="color:var(--teal)">${r[6]||'—'}</td>
              <td style="color:var(--muted)">${r[7]||'—'}</td>
              <td style="color:var(--coral);font-weight:700">${cop(Number(r[8]||0))}</td>
              <td style="color:var(--green)">${fmt(r[9])}</td>
              <td style="color:var(--p2)">${r[10]||'—'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>

      <div class="section-title">Gasto por ad set</div>
      <div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;">
        ${bars(rows.map(r=>({label:r[1]||'—',val:Number(r[8]||0),color:'var(--coral)'})))}
      </div>`;
  } catch(e) {
    el.innerHTML = `<div class="error">Error: ${e.message}</div>`;
  }
}

async function sincronizarMeta() {
  const btn = document.getElementById('btnSyncMeta');
  if (btn) { btn.textContent='⟳ Sincronizando...'; btn.disabled=true; }
  try {
    const r = await fetchSheets({ accion:'sincronizarMeta' });
    if (r.ok) {
      _loaded['meta'] = false;
      await renderMeta();
    } else {
      alert('Error: ' + (r.mensaje||'No se pudo sincronizar'));
      if (btn) { btn.textContent='↻ Sincronizar'; btn.disabled=false; }
    }
  } catch(e) {
    alert('Error de conexión: ' + e.message);
    if (btn) { btn.textContent='↻ Sincronizar'; btn.disabled=false; }
  }
}

// ── RESUMEN ───────────────────────────────────────────────────
function renderResumen(d) {
  const k = d.kpis;
  const gen   = Number(k['Cupones generados']?.total||0);
  const canj  = Number(k['Canjeados']?.total||0);
  const tasa  = k['Tasa de canje']?.total||'0%';
  const disp  = Number(k['Disponibles activos']?.total||0);
  const venc  = Number(k['Vencidos']?.total||0);
  const n1    = Number(k['Cupones generados']?.n1||0);
  const e1    = Number(k['Cupones generados']?.e1||0);
  const e2    = Number(k['Cupones generados']?.e2||0);
  const e3    = Number(k['Cupones generados']?.e3||0);
  const valorGen = canj * PRECIO_BOWL;

  document.getElementById('panel-resumen').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi p"><div class="kpi-label">Entregados</div><div class="kpi-value">${fmt(gen)}</div><div class="kpi-sub">Total generados</div></div>
      <div class="kpi green"><div class="kpi-label">Canjeados</div><div class="kpi-value">${fmt(canj)}</div><div class="kpi-sub">Tasa: ${tasa}</div></div>
      <div class="kpi yellow"><div class="kpi-label">Tasa de canje</div><div class="kpi-value">${tasa}</div><div class="kpi-sub">${fmt(canj)} de ${fmt(gen)}</div></div>
      <div class="kpi coral"><div class="kpi-label">Valor generado</div><div class="kpi-value">${cop(valorGen)}</div><div class="kpi-sub">Bowl ~${cop(PRECIO_BOWL)}</div></div>
      <div class="kpi teal"><div class="kpi-label">Disponibles</div><div class="kpi-value">${fmt(disp)}</div><div class="kpi-sub">Por canjear</div></div>
      <div class="kpi p"><div class="kpi-label">Vencidos</div><div class="kpi-value">${fmt(venc)}</div><div class="kpi-sub">Sin canjear</div></div>
    </div>

    <div class="section-title">Mix de usuarios Loopy</div>
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;">
      ${bars([
        {label:'N1 — Nuevo',       val:n1,           color:'#27ae60'},
        {label:'E1 — Ocasional',   val:e1,           color:'#f1c40f'},
        {label:'E2 — Regular',     val:e2,           color:'#e67e22'},
        {label:'E3 — Frecuente',   val:e3,           color:'#e74c3c'},
        {label:'E4 — Revalidado',  val:Number(d.resumen?.e4||0), color:'#8e44ad'},
      ])}
    </div>`;
}

// ── FUENTES + UTM CRUZADO ─────────────────────────────────────
async function renderCampanas(d) {
  const el = document.getElementById('panel-campanas');
  // Cargar data cruzada UTM
  try {
    const utm = await fetchSheets({ accion:'dashboardCampanasUTM' });
    const camps = utm.ok ? utm.campanas : [];
    const cruzados = utm.cruzados||0;
    const sinCruce = utm.sinCruce||0;

    el.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px;">
        <div class="section-title" style="margin:0">Campañas × Links × Meta Ads</div>
        <div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--muted)">
          ${cruzados} cruzados · ${sinCruce} sin UTM
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Campaña</th><th>Ad Set</th><th>Fase</th>
            <th>Entregados</th><th>Canjeados</th><th>Tasa</th>
            <th>Ingreso neto</th><th>Gasto Meta</th><th>CAC</th><th>ROI</th>
          </tr></thead>
          <tbody>
            ${camps.map(c=>{
              const hasRoi = c.roi && c.roi !== 'null';
              const hasCac = c.cac && c.cac > 0;
              return `<tr>
                <td style="font-weight:700;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${c.nombre}">${c.nombre||'—'}</td>
                <td style="font-size:11px;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${c.adset}">${c.adset||'—'}</td>
                <td><span style="font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(124,77,255,0.15);color:var(--p2)">${c.fase||'—'}</span></td>
                <td>${fmt(c.total)}</td>
                <td style="color:var(--green);font-weight:700">${fmt(c.canjeados)}</td>
                <td style="color:var(--yellow)">${c.total>0?((c.canjeados/c.total)*100).toFixed(1)+'%':'0%'}</td>
                <td style="color:var(--coral)">${cop(c.ingresoNeto||0)}</td>
                <td style="color:var(--muted)">${c.meta?cop(c.meta.gasto):'—'}</td>
                <td style="color:var(--teal);font-weight:700">${hasCac?cop(c.cac):'—'}</td>
                <td style="color:${hasRoi&&parseFloat(c.roi)>100?'var(--green)':'var(--coral)'};font-weight:700">${hasRoi?c.roi:'—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>

      <div class="section-title">Cupones entregados por campaña</div>
      <div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;">
        ${bars(camps.slice(0,10).map(c=>({label:c.nombre||c.adset||'sin nombre',val:Number(c.total)||0,color:'var(--p)'})))}
      </div>

      <div class="section-title">Canjeados por campaña</div>
      <div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;">
        ${bars(camps.slice(0,10).map(c=>({label:c.nombre||c.adset||'sin nombre',val:Number(c.canjeados)||0,color:'var(--green)'})))}
      </div>

      ${sinCruce>0?`<div class="info" style="font-size:11px;margin-top:16px">
        ℹ️ <strong>${sinCruce} cupones</strong> no tienen UTMs en col Q — son cupones anteriores a los links V2.0 o generados orgánicamente.
        Se muestran agrupados en la tabla de fuentes del resumen.
      </div>`:''}`;
  } catch(e) {
    // Fallback a data básica de Sheets
    const maxEnt = Math.max(...d.fuentes.map(f=>Number(f.entregados)||0),1);
    el.innerHTML = `
      <div class="info">Usando datos básicos por fuente (sin cruce UTM)</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Fuente</th><th>Entregados</th><th>Canjeados</th><th>Tasa</th><th>Vencidos</th></tr></thead>
          <tbody>
            ${d.fuentes.map(f=>`<tr>
              <td>${f.fuente}</td><td>${fmt(f.entregados)}</td>
              <td style="color:var(--green)">${fmt(f.canjeados)}</td>
              <td style="color:var(--yellow)">${f.tasa}</td>
              <td style="color:var(--muted)">${fmt(f.vencidos)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }
}

// ── CIUDADES ─────────────────────────────────────────────────
function renderCiudades(d) {
  document.getElementById('panel-ciudades').innerHTML = `
    <div class="section-title">Rendimiento por ciudad</div>
    <div class="city-grid">
      ${d.ciudades.slice(0,12).map(c=>`
        <div class="city-card">
          <div class="city-name">${c.ciudad}</div>
          <div class="city-row"><span>Entregados</span><span>${fmt(c.entregados)}</span></div>
          <div class="city-row"><span>Canjeados</span><span style="color:var(--green)">${fmt(c.canjeados)}</span></div>
          <div class="city-row"><span>Tasa</span><span style="color:var(--yellow)">${c.tasa}</span></div>
          <div class="city-row"><span>Vencidos</span><span style="color:var(--muted)">${fmt(c.vencidos)}</span></div>
        </div>`).join('')}
    </div>
    <div class="section-title">Canjeados por ciudad</div>
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;">
      ${bars(d.ciudades.slice(0,10).map(c=>({label:c.ciudad,val:Number(c.canjeados)||0,color:'var(--coral)'})))}
    </div>`;
}

// ── REACTIVACIÓN ─────────────────────────────────────────────
function renderReactivacion(d) {
  const colors = {'A-30%':'var(--green)','B-40%':'var(--teal)','Control':'var(--muted)','Control-Loopy':'var(--yellow)'};
  const rea = d.reactivacion;

  document.getElementById('panel-reactivacion').innerHTML = `
    <div class="section-title">A/B Test — Descuento óptimo de reactivación</div>
    <div class="ab-grid">
      ${d.abTest.filter(a=>['A-30%','B-40%','Control'].includes(a.grupo)).map(a=>`
        <div class="ab-card">
          <div class="ab-label">${a.grupo}</div>
          <div class="ab-pct" style="color:${colors[a.grupo]||'var(--muted)'}">${a.tasa||'0%'}</div>
          <div class="ab-sub">${fmt(a.canjeados)} / ${fmt(a.enviados)} canjeados</div>
        </div>`).join('')}
    </div>

    <div class="section-title">Reactivación vs Primer impacto</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Flujo</th><th>Tasa de canje</th><th>Detalle</th></tr></thead>
        <tbody>
          ${rea.map(r=>`<tr>
            <td style="font-weight:700">${r.flujo}</td>
            <td style="color:var(--yellow);font-size:16px;font-weight:800">${r.tasa}</td>
            <td style="color:var(--muted)">${r.obs}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="section-title">Grupos completos A/B</div>
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;">
      ${bars(d.abTest.map(a=>({label:a.grupo,val:Number(a.enviados)||0,color:colors[a.grupo]||'var(--muted)'})))}
    </div>`;
}

// ── INIT ─────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  _loaded['resumen']=true;
  renderTab('resumen');
});

// ── CAC & ROI ────────────────────────────────────────────────
async function renderCAC() {
  const el = document.getElementById('panel-cac');
  el.innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-txt">Calculando CAC & ROI...</div></div>';
  try {
    const d = await fetchSheets({ accion:'dashboardCAC' });
    if (!d.ok) throw new Error(d.mensaje||'Error');

    const PRECIO = d.precio || 25400;

    el.innerHTML = `
      <!-- KPIs Meta -->
      <div class="section-title">CAC Meta Ads — últimos 30 días</div>
      <div class="kpi-grid">
        <div class="kpi coral">
          <div class="kpi-label">Gasto Meta</div>
          <div class="kpi-value">${cop(d.gastoMeta)}</div>
          <div class="kpi-sub">últimos 30 días</div>
        </div>
        <div class="kpi green">
          <div class="kpi-label">CAC Meta</div>
          <div class="kpi-value">${cop(d.cacMeta)}</div>
          <div class="kpi-sub">por cliente nuevo canjeado</div>
        </div>
        <div class="kpi yellow">
          <div class="kpi-label">Ingreso neto</div>
          <div class="kpi-value">${cop(d.ingresoNetoMeta)}</div>
          <div class="kpi-sub">${fmt(d.canjeadosMeta)} canjes × precio con desc.</div>
        </div>
        <div class="kpi teal">
          <div class="kpi-label">ROI Meta</div>
          <div class="kpi-value">${d.roiMeta}</div>
          <div class="kpi-sub">ingreso neto ÷ gasto</div>
        </div>
        <div class="kpi p">
          <div class="kpi-label">Cupones Meta</div>
          <div class="kpi-value">${fmt(d.totalMeta)}</div>
          <div class="kpi-sub">${fmt(d.canjeadosMeta)} canjeados · ${d.totalMeta>0?((d.canjeadosMeta/d.totalMeta)*100).toFixed(1):0}% tasa</div>
        </div>
      </div>

      <!-- CAC Reactivación -->
      <div class="section-title">CAC Reactivación (WA)</div>
      <div class="kpi-grid">
        <div class="kpi coral">
          <div class="kpi-label">Costo WA enviados</div>
          <div class="kpi-value">${cop(d.costoWA)}</div>
          <div class="kpi-sub">~$275 por mensaje</div>
        </div>
        <div class="kpi green">
          <div class="kpi-label">CAC Reactivación</div>
          <div class="kpi-value">${cop(d.cacRea)}</div>
          <div class="kpi-sub">por cliente reactivado</div>
        </div>
        <div class="kpi yellow">
          <div class="kpi-label">Ingreso neto REA</div>
          <div class="kpi-value">${cop(d.ingresoNetoRea)}</div>
          <div class="kpi-sub">${fmt(d.canjeadosRea)} canjes reactivación</div>
        </div>
        <div class="kpi teal">
          <div class="kpi-label">ROI Reactivación</div>
          <div class="kpi-value">${d.roiRea}</div>
          <div class="kpi-sub">ingreso neto ÷ costo WA</div>
        </div>
      </div>

      <!-- CAC por segmento -->
      <div class="section-title">CAC por segmento Loopy</div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Segmento</th><th>Total</th><th>Canjeados</th><th>Tasa</th>
            <th>Desc. prom.</th><th>Ingreso neto</th><th>CAC estimado</th><th>ROI</th>
          </tr></thead>
          <tbody>
            ${d.cacSegmentos.map(s=>{
              const color = {N1:'var(--green)',E1:'var(--yellow)',E2:'var(--teal)',E3:'var(--p2)'}[s.seg]||'var(--muted)';
              return `<tr>
                <td><span style="color:${color};font-weight:800">${s.seg}</span></td>
                <td>${fmt(s.total)}</td>
                <td style="color:var(--green)">${fmt(s.canjeados)}</td>
                <td style="color:var(--yellow)">${s.total>0?((s.canjeados/s.total)*100).toFixed(1)+'%':'0%'}</td>
                <td style="color:var(--muted)">${s.descProm}</td>
                <td style="color:var(--coral)">${cop(s.ingresoNeto)}</td>
                <td style="color:var(--teal);font-weight:700">${s.cac>0?cop(s.cac):'—'}</td>
                <td style="color:var(--p2)">${s.roi}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>

      <!-- CAC por fuente -->
      <div class="section-title">Ingreso neto por fuente</div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Fuente</th><th>Entregados</th><th>Canjeados</th><th>Tasa</th><th>Ingreso neto total</th><th>Ingreso prom/canje</th>
          </tr></thead>
          <tbody>
            ${d.cacFuentes.map(f=>`<tr>
              <td style="font-weight:700">${f.fuente}</td>
              <td>${fmt(f.total)}</td>
              <td style="color:var(--green)">${fmt(f.canjeados)}</td>
              <td style="color:var(--yellow)">${f.tasa}</td>
              <td style="color:var(--coral)">${cop(f.ingresoNeto)}</td>
              <td style="color:var(--muted)">${f.canjeados>0?cop(Math.round(f.ingresoNeto/f.canjeados)):'—'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>

      <div class="info" style="font-size:11px;line-height:1.7">
        💡 <strong>Nota metodológica:</strong> El ingreso neto = precio bowl ($${PRECIO.toLocaleString('es-CO')}) × (1 - descuento%). 
        El CAC por segmento es una estimación proporcional al gasto Meta mientras no haya UTMs por ad set. 
        Cuando actives los links V2.0 con <code>{{campaign.id}}</code>, el CAC será exacto por anuncio.
      </div>`;
  } catch(e) {
    el.innerHTML = `<div class="error">Error: ${e.message}</div>`;
  }
}
</script>
</body>
</html>
